server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
    pipeline_stages:
      # All three of this app's own services log one JSON object per line
      # (core/logging_config.py, called from main.py/workers/celery_app.py/
      # llm_proxy/main.py) - parse it so `level`, `event`, etc. become
      # queryable LogQL labels/fields instead of opaque text. Previously
      # scoped to just `ucenik-app-1` - worker and llm-proxy logs passed
      # through unparsed, so any dashboard querying their events (e.g.
      # llm_proxy.upstream_error) would have silently returned nothing.
      # Third-party containers (mongo, redis, chroma, minio, ...) aren't
      # JSON and correctly don't match this selector.
      - match:
          selector: '{container=~"ucenik-(app|worker|llm-proxy)-.*"}'
          stages:
            - json:
                expressions:
                  level: level
                  event: event
            - labels:
                level:
                event:
