# StatefulSet, not Deployment: it gives the pod a stable identity (mongodb-0)
# and its own PersistentVolumeClaim from volumeClaimTemplates. That claim
# survives pod restarts, rescheduling and `kubectl delete pod`. Deleting the
# StatefulSet does not delete it either; only deleting the PVC (or the whole
# namespace/cluster) loses the data.
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  # Headless (no virtual IP): `mongodb` resolves straight to the pod's IP.
  # StatefulSets require one as their "governing" Service (serviceName below).
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongodb
      port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      enableServiceLinks: false
      containers:
        - name: mongodb
          image: mongo:8
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            # Root user is created only on the very first start (empty data
            # dir). Changing these later does NOT change the existing
            # password - same behavior as docker-compose's mongo container.
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef: { name: ucenik-secrets, key: MONGO_USERNAME }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: ucenik-secrets, key: MONGO_PASSWORD }
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
