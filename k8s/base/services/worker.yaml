# Celery worker (src/ucenik/workers/celery_app.py): document ingest and
# planner generation. Same image as api, different command. No Service - it
# only makes outgoing connections (pulls jobs from Redis), nothing calls it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      enableServiceLinks: false
      # Give an in-flight ingest job time to finish before SIGKILL. Celery
      # does a warm shutdown on SIGTERM (stops taking new jobs, finishes the
      # current one).
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: worker
          image: ucenik-backend
          command: ["uv", "run", "celery", "-A", "ucenik.workers.celery_app", "worker", "--pool=solo", "--loglevel=info"]
          envFrom:
            - configMapRef: { name: ucenik-config }
          # Same list as api.yaml: the worker imports the same Settings(),
          # which requires JWT_SECRET even though the worker never signs tokens.
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: ucenik-secrets, key: JWT_SECRET }
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef: { name: ucenik-secrets, key: MONGO_USERNAME }
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef: { name: ucenik-secrets, key: MONGO_PASSWORD }
            - name: MONGODB_URL
              value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@mongodb:27017/?authSource=admin
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: ucenik-secrets, key: S3_ACCESS_KEY }
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: ucenik-secrets, key: S3_SECRET_KEY }
            - name: LLM_PROXY_API_KEY
              valueFrom:
                secretKeyRef: { name: ucenik-secrets, key: LLM_PROXY_API_KEY }
            - name: EMBEDDING_SERVICE_API_KEY
              valueFrom:
                secretKeyRef: { name: ucenik-secrets, key: EMBEDDING_SERVICE_API_KEY }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
