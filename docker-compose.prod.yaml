# Production overlay - adds the app + Celery worker + LLM proxy +
# embedding service + nginx on top of docker-compose.yaml's infra services.
# Used on the deploy target only:
#
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml pull
#   docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
#
# Deliberately kept separate from docker-compose.yaml (rather than adding
# `app`/`worker`/`llm-proxy`/`nginx-certbot` there directly) so local dev is
# unaffected - `docker compose up` during development still only starts
# infra, same as before; the app runs via `uv run fastapi dev`, the worker
# via `uv run celery -A ucenik.workers.celery_app worker --pool=solo` (see
# workers/celery_app.py's docstring on why `--pool=solo`), and the LLM proxy
# via `uv run fastapi run src/ucenik/llm_proxy/main.py --port 4000` - all on
# the host for hot-reload. No TLS in dev either - that's a prod-only concern.
#
# No `build:` directive here on purpose - this always pulls the image GitHub
# Actions built and pushed to GHCR (.github/workflows/deploy.yml), it never
# builds from source on the server itself. `worker`, `llm-proxy`, and
# `embedding-service` reuse the exact same image as `app` (one Dockerfile,
# same deps/embedding-model layer) - only the command differs.
#
# Every service below also carries deploy.resources.limits
# (docs/security-hardening.md item 9) - without any cap, a burst of
# concurrent embedding calls (or a runaway process in any one container)
# could exhaust host memory and take down every *other* service via
# OOM-killer collateral damage, not just the offending one. Compose v2
# honors deploy.resources.limits under plain `docker compose up` too (not
# swarm-only the way it historically was - confirmed against the actually-
# installed Compose version, v2.35). Sizes below are starting points, not
# load-tested figures - tune against the real deploy host's specs and
# actual usage once it's live.
#
# Every service also gets an explicit `networks:` (docs/security-
# hardening.md item 11) instead of the implicit single flat network
# docker-compose.yaml's dev-only setup uses - see the top-level `networks:`
# block at the bottom of this file for the two networks and why. Not
# needed in docker-compose.yaml itself: dev has nothing publicly exposed
# (the app runs on the host via `uv run fastapi dev`, not in a container),
# so there's no edge/internal boundary to draw there in the first place.
services:
  app:
    image: ${GHCR_IMAGE}
    env_file:
      - .env
    ports:
      # Debug-only, not the public route - nginx (below) is what actually
      # fronts this for real traffic on 80/443. Bound to a different host
      # port than 8000 on purpose: chromadb already claims
      # 127.0.0.1:8000:8000 below, and 0.0.0.0:8000 (this service's old
      # binding) silently conflicts with that - 0.0.0.0 already covers the
      # loopback interface, so both could never actually come up together.
      # Found by actually reading the port list side by side, not by
      # hitting the conflict at deploy time.
      - "127.0.0.1:8001:8000"
    depends_on:
      - mongodb
      - redis
      - chromadb
      - minio
      - llm-proxy
      - embedding-service
    restart: unless-stopped
    # I/O-bound (DB/Redis/Chroma/S3 calls, HTTP to llm-proxy/embedding-
    # service) - no ML runtime of its own, so this is a modest cap.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    # On both: `edge` to receive from nginx-certbot, `internal` to reach
    # everything else - the only service that needs to straddle both.
    networks:
      - edge
      - internal

  worker:
    image: ${GHCR_IMAGE}
    command: ["uv", "run", "celery", "-A", "ucenik.workers.celery_app", "worker", "--pool=solo", "--loglevel=info"]
    env_file:
      - .env
    depends_on:
      - mongodb
      - redis
      - chromadb
      - minio
      - llm-proxy
      - embedding-service
    restart: unless-stopped
    # Same profile as `app` - runs the same code, just background jobs
    # (ingest, planner generation) instead of request/response.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks:
      - internal

  # No `ports:` on purpose - only `app`/`worker` need to reach this, over
  # the docker-internal network by service name (see LLM_PROXY_URL in
  # .env.prod.example). Never exposed to the host or the public internet.
  llm-proxy:
    image: ${GHCR_IMAGE}
    command: ["uv", "run", "fastapi", "run", "src/ucenik/llm_proxy/main.py", "--host", "0.0.0.0", "--port", "4000"]
    env_file:
      - .env
    restart: unless-stopped
    # Thin HTTP relay to Groq/HF - no heavy compute of its own.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    # `internal`, not egress-isolated (see the top-level `networks:` block)
    # - this is the one service on `internal` that genuinely needs real
    # outbound internet access, to Groq/HF.
    networks:
      - internal

  # No `ports:` either, same reasoning as llm-proxy above - internal only.
  # Loads BGE-M3 exactly once (src/ucenik/embedding_service/) rather than
  # `app` and `worker` each loading their own independent copy - see that
  # package's module docstring for the full reasoning. If this ever needs
  # to move to its own dedicated host (it's the single heaviest CPU/RAM
  # consumer in this stack - CPU-only inference, no GPU here), just point
  # EMBEDDING_SERVICE_URL at it - rag/embedder.py is a plain HTTP client,
  # same as llm/proxy_client.py, no code changes needed either way. Doing
  # that for real needs actual network-level access control though (a VPC/
  # WireGuard/firewall-scoped rule) - the "no ports: on this docker
  # network" trick only protects it while it stays on this one host.
  embedding-service:
    image: ${GHCR_IMAGE}
    command:
      ["uv", "run", "fastapi", "run", "src/ucenik/embedding_service/main.py", "--host", "0.0.0.0", "--port", "4001"]
    env_file:
      - .env
    restart: unless-stopped
    # The heaviest single consumer in this stack (BGE-M3, CPU-only
    # inference, ~2.3GB baseline just to load the model) - highest limit
    # of anything here on purpose, with headroom over that baseline for
    # concurrent request working-set, not just the model weights.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3g
    networks:
      - internal

  # Hardening: only `app` needs to be reachable from outside this host - it
  # talks to everything else over the docker-internal network by service
  # name regardless of host port bindings. Rebinding these to 127.0.0.1
  # keeps them reachable for your own debugging (`ssh -L 27017:...`) without
  # exposing raw Mongo/Redis/Chroma/MinIO to the public internet.
  mongodb:
    ports:
      - "127.0.0.1:27017:27017"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks:
      - internal

  redis:
    ports:
      - "127.0.0.1:6379:6379"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - internal

  chromadb:
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
    networks:
      - internal

  minio:
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - internal

  # The only service actually exposed to the public internet. Replaces
  # Caddy (docs/security-hardening.md item 1 - Caddy is gone from this repo
  # entirely now). Terminates TLS via Let's Encrypt (same automatic-renewal
  # deal Caddy gave for free - jonasal/nginx-certbot wraps nginx + certbot's
  # own renewal loop, no cron/manual step on this end) and reverse-proxies
  # to `app` over the docker-internal network - see
  # nginx/templates/app.conf.template for the actual server block (unlike
  # Caddy's reverse_proxy, nginx needs the WebSocket-upgrade headers and
  # client_max_body_size spelled out explicitly - that file's comments cover
  # why). DOMAIN is envsubst'd into that template at container start by the
  # image's own entrypoint hook; CERTBOT_EMAIL is required by Let's Encrypt
  # to contact you about certificate/account issues.
  nginx-certbot:
    image: jonasal/nginx-certbot:5-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - letsencrypt_certs:/etc/letsencrypt
    depends_on:
      - app
    restart: unless-stopped
    # Just terminates TLS and proxies - no real compute of its own.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
    # `edge` only - reaches `app` there and nothing else; has no business
    # being able to reach mongodb/redis/chromadb/minio directly, which is
    # the entire point of this split (docs/security-hardening.md item 11).
    networks:
      - edge

  # Local backups (docs/backlog.md item 2) - each loops on its own
  # interval, dumping/mirroring then pruning anything past
  # BACKUP_RETENTION_DAYS. No cron on the host, no third-party backup
  # target - see the scripts themselves (backup/*.sh) for the exact
  # commands and restore instructions. Entrypoint override means neither
  # container runs the image's normal server process (mongod / mc's
  # default) - just the backup loop.
  backup-mongo:
    image: mongo:8
    entrypoint: ["/bin/bash", "/backup/backup-mongo.sh"]
    env_file:
      - .env
    volumes:
      - ./backup/backup-mongo.sh:/backup/backup-mongo.sh:ro
      - mongo_backups:/backups
    depends_on:
      - mongodb
    restart: unless-stopped
    # mongodump's memory use scales with the data being dumped - bump this
    # if BACKUP_RETENTION_DAYS/the Mongo dataset ever grows large enough to
    # actually approach it.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - internal

  backup-minio:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "/backup/backup-minio.sh"]
    env_file:
      - .env
    volumes:
      - ./backup/backup-minio.sh:/backup/backup-minio.sh:ro
      - minio_backups:/backups
    depends_on:
      - minio
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - internal

volumes:
  # Certs, account keys, and the auto-generated Diffie-Hellman params
  # (nginx/templates/app.conf.template) - persisted so a container
  # restart/redeploy doesn't re-request a cert from Let's Encrypt (which
  # is rate-limited) or regenerate dhparams (which takes a couple minutes).
  letsencrypt_certs:
  mongo_backups:
  minio_backups:

# docs/security-hardening.md item 11 - previously every service (including
# `nginx-certbot`, the only one actually facing the internet) shared one
# single flat default network, meaning nginx had direct L3 reachability to
# mongodb/redis/chromadb/minio's real ports regardless of what wasn't
# published to the host. Split in two:
# - `edge`: nginx-certbot + app - the one path traffic takes in from the
#   internet to the API.
# - `internal`: everything that only ever talks to other backend services.
# `app` is the only service on both (it has to receive from `edge` and
# reach `internal`). Not marked `internal: true` (which would additionally
# deny the network any outbound route at all, not just inbound from
# `edge`) - `llm-proxy` sits on `internal` and needs real egress to
# Groq/HF, so full egress-isolation isn't compatible with this network
# without carving out a third network for that one service alone, which
# isn't worth the added complexity here. The inbound boundary (nginx can't
# reach the data stores) is the actual goal and doesn't need it.
networks:
  edge:
  internal:
