name: Backend

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose*.yaml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-test:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Audit dependencies for known vulnerabilities
        continue-on-error: true
        run: |
          uv export --frozen --no-dev --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps

      - name: Run tests
        run: uv run pytest -q
        env:
          # Required by Settings() at import time. The URLs are placeholders -
          # tests/conftest.py overrides them with the testcontainers' real ones.
          JWT_SECRET: ci-test-secret-not-for-production-use
          MAX_QUOTA: "200000"
          MONGODB_URL: mongodb://placeholder:27017
          REDIS_URL: redis://placeholder:6379

  backend-build:
    needs: backend-test
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image name
        id: image
        # GHCR requires lowercase; ${VAR,,} is bash for "lowercase this".
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}
          docker push ${{ steps.image.outputs.name }}:latest

      # Self-hosted runners keep their disk between runs, so without this every
      # build leaves another image behind. always() = run even if a step failed.
      - name: Remove local images
        if: always()
        run: |
          docker image rm ${{ steps.image.outputs.name }}:${{ github.sha }} ${{ steps.image.outputs.name }}:latest || true

  # No deploy job yet: the docker-compose-over-SSH deploy was removed in the
  # move to Kubernetes, and the only cluster so far is local (k8s/README.md).
  # When a real cluster exists, add a job here that runs
  #   kubectl apply -k k8s/overlays/<env>
  # with this run's image tag (github.sha), using a KUBECONFIG secret.
