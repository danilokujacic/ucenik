name: Deploy

# Auto-deploys on every push to main. No manual gate beyond the test job -
# see docs/deployment.md for the reasoning and how to change this to
# workflow_dispatch (manual trigger) if that stops feeling safe enough.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reuses the project's own docker-compose.yaml for infra instead of
      # GitHub Actions `services:` blocks - services: can't override a
      # container's command, and MinIO specifically needs `server /data` as
      # an explicit argument. One definition of "what infra looks like",
      # not two that can drift.
      - name: Start infra (Mongo, Redis, Chroma, MinIO)
        run: docker compose up -d mongodb redis chromadb minio

      - name: Wait for infra to be ready
        run: sleep 15

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -q
        env:
          MONGODB_URL: mongodb://admin:admin@localhost:27017/?authSource=admin
          MONGODB_DB_NAME: ucenik_ci
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-not-for-production-use
          MAX_QUOTA: "200000"
          S3_ENDPOINT_URL: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: documents
          CHROMA_HOST: localhost
          CHROMA_PORT: "8000"

      - name: Tear down infra
        if: always()
        run: docker compose down -v

      # docs/security-hardening.md item 13 - fails the job on a known CVE
      # in any resolved dependency (uv.lock), same "gate, don't just log"
      # principle as Trivy above. Runs against the same uv-managed
      # environment `uv sync` just built - no separate install step needed.
      - name: Audit Python dependencies (pip-audit)
        run: uvx pip-audit

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Same gating principle as pip-audit above, for the npm ecosystem -
      # pnpm's own built-in audit command, no extra tooling needed.
      - name: Audit frontend dependencies (pnpm audit)
        working-directory: frontend
        run: pnpm audit

  build-and-push:
    needs: [test, frontend-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        # ghcr.io requires a lowercase image name; github.repository preserves
        # whatever case the owner/repo actually has.
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Built and loaded into the runner's own local docker daemon, not
      # pushed yet (docs/security-hardening.md item 10) - Trivy scans it
      # below, before anything vulnerable ever reaches GHCR. Scanning
      # after push (e.g. GHCR's own built-in scanning) only ever catches
      # this after the fact - too late to stop a vulnerable image from
      # being pullable in the meantime.
      - name: Build (local, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Scans both the OS package layer (python:3.14-slim base +
      # apt-installed tesseract-ocr/poppler-utils) and the Python
      # dependency layer (uv.lock) for known CVEs. ignore-unfixed: true -
      # no point failing the build on a CVE with no available fix yet,
      # there's nothing actionable to do about it today; exit-code 1 is
      # what actually gates the push below on CRITICAL/HIGH findings that
      # *do* have a fix available.
      - name: Scan image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push
        run: |
          docker push ${{ steps.image.outputs.name }}:latest
          docker push ${{ steps.image.outputs.name }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml pull
            docker compose -f docker-compose.yaml -f docker-compose.prod.yaml up -d
            docker image prune -f
